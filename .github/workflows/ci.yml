name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build place file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        run: |
          curl -fsSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -o rojo.zip
          chmod +x rojo

      - name: Build
        run: ./rojo build default.project.json -o FartBrainrotSimulator.rbxl

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: PowerPunchSimulator
          path: FartBrainrotSimulator.rbxl
