name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build place file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        run: |
          curl -fsSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -o rojo.zip
          chmod +x rojo

      - name: Build
        run: ./rojo build default.project.json -o FartBrainrotSimulator.rbxl

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: PowerPunchSimulator
          path: FartBrainrotSimulator.rbxl

  lint:
    name: StyLua + Selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/StyLua@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check src tests
      - name: Selene
        uses: Roblox/selene-action@v1
        with:
          args: --config selene.toml src

  tests:
    name: Lune unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lune
        run: |
          curl -fsSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip
          unzip -o lune.zip
          chmod +x lune
      - name: Run pure-logic tests
        run: ./lune run tests/test_runner
